name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v1.0.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

      # Same command as local releases: prebuild (android/ is generated, not committed) then an arm64 release build
      - run: npm run build:apk

      - run: cp android/app/build/outputs/apk/release/app-release.apk "expense-tracker-$TAG.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "expense-tracker-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Expense Tracker $TAG" \
            --generate-notes
